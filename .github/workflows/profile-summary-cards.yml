name: GitHub Profile Summary Cards

on:
  schedule:
    # Monthly, not "*/30". A day-of-month step (*/30) fires on the 1st AND the
    # 31st, which is twice in most months - not every 30 days. The 1st of each
    # month is the correct ~30 day cadence.
    # Off-peak minute on purpose: scheduled runs at :00 are the most likely to
    # be delayed or dropped by GitHub under load.
    - cron: "17 3 1 * *" # 1st of each month, 03:17 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Both accounts are required, so validate both PATs up front. Without
      # this the run dies mid-way with an opaque "AxiosError: Request failed
      # with status code 401" that does not say which secret is bad.
      - name: Preflight - validate both PATs
        env:
          PERSONAL_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          WORK_TOKEN: ${{ secrets.WORK_GITHUB_TOKEN }}
        run: |
          # -e off: failures are collected and reported together, not on the
          # first one, so a single run tells you about both tokens.
          set +e -u
          fail=0

          check() {
            name=$1
            token=$2
            expected=$3

            if [ -z "$token" ]; then
              echo "::error::Secret $name is missing or empty."
              fail=1
              return
            fi

            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user)

            case "$code" in
              200)
                # grep/sed instead of jq: no extra tool dependency.
                login=$(tr ',' '\n' < "$body" | sed -n 's/.*"login"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
                if [ "$login" != "$expected" ]; then
                  echo "::error::Secret $name authenticates as '$login', but '$expected' was expected. Wrong token in the wrong secret."
                  fail=1
                else
                  echo "$name -> $login (ok)"
                  # REST /user is not a sufficient check. The action reads the
                  # contribution calendar, which only exists in the GraphQL
                  # API, and GraphQL rejects most fine-grained PATs with 401
                  # even when REST accepts them. Probe the exact query shape
                  # the action needs so a fine-grained token fails here with a
                  # useful message instead of mid-run with a bare AxiosError.
                  gql_body=$(mktemp)
                  gql_code=$(curl -sS -o "$gql_body" -w '%{http_code}' \
                    -X POST \
                    -H "Authorization: Bearer $token" \
                    -H "Content-Type: application/json" \
                    -d '{"query":"{viewer{contributionsCollection{contributionCalendar{totalContributions}}}}"}' \
                    https://api.github.com/graphql)

                  if [ "$gql_code" = "401" ]; then
                    echo "::error::Secret $name passes REST but is rejected by GraphQL with 401. This is what a fine-grained PAT looks like here. Replace it with a *classic* PAT (Tokens (classic)) on the $expected account, scopes read:user and repo."
                    fail=1
                  elif [ "$gql_code" != "200" ]; then
                    echo "::error::Secret $name got HTTP '$gql_code' from the GraphQL API."
                    fail=1
                  elif grep -q '"errors"' "$gql_body"; then
                    # GraphQL answers scope and SSO failures with 200 + an
                    # errors array, so the status code alone would pass them.
                    echo "::error::Secret $name reached GraphQL but the query failed. Usually a missing scope or unauthorized SAML SSO. Response:"
                    head -c 500 "$gql_body"
                    echo
                    fail=1
                  else
                    total=$(sed -n 's/.*"totalContributions"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$gql_body")
                    echo "  $name graphql ok (totalContributions=${total:-?})"
                  fi
                fi
                ;;
              401)
                echo "::error::Secret $name rejected with 401. The PAT is expired, revoked, or malformed (stray newline / 'Bearer ' prefix / truncated paste). Regenerate it on the $expected account and update the secret."
                fail=1
                ;;
              403)
                echo "::error::Secret $name got 403. Missing scope, rate limited, or SAML SSO authorization required for this PAT."
                fail=1
                ;;
              *)
                echo "::error::Secret $name got HTTP '$code' from /user."
                fail=1
                ;;
            esac

            # Classic PATs report their own expiry. Surface it, because a
            # monthly schedule can go stale for weeks before anyone notices.
            expiry=$(grep -i '^github-authentication-token-expiration:' "$headers" | cut -d: -f2- | tr -d '\r' | sed 's/^ *//')
            if [ -n "$expiry" ]; then
              exp_ts=$(date -d "$expiry" +%s 2>/dev/null)
              if [ -n "$exp_ts" ]; then
                left=$(( (exp_ts - $(date +%s)) / 86400 ))
                echo "  $name expires $expiry ($left days left)"
                if [ "$left" -lt 45 ]; then
                  echo "::warning::$name expires in $left days. With a monthly schedule that breaks between runs - regenerate it with no expiration."
                fi
              fi
            fi
          }

          check SUMMARY_GITHUB_TOKEN "$PERSONAL_TOKEN" JanoAngulo
          check WORK_GITHUB_TOKEN    "$WORK_TOKEN"     johnrusselangulo-cp

          if [ "$fail" -ne 0 ]; then
            echo "Preflight failed - no cards regenerated, nothing committed."
            exit 1
          fi

      # Personal account -> profile-summary-card-output/github_dark/
      # AUTO_PUSH off: one commit/push at the end, so the PATs are only ever
      # used to read the GitHub API, never to push.
      - name: Generate personal cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: JanoAngulo
          UTC_OFFSET: 8
          THEME: github_dark
          BRANCH_NAME: main
          AUTO_PUSH: false

      # The action runs `sudo rm -rf ./profile-summary-card-output/` on every
      # invocation, wiping ALL themes and not just its own. Stash the personal
      # cards outside the workspace before the work step deletes them.
      - name: Stash personal cards
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/personal-cards"
          cp -r profile-summary-card-output/github_dark "$RUNNER_TEMP/personal-cards"

      # Work account, same github_dark theme so the colors match the personal
      # cards. It also writes to a github_dark folder, so it gets renamed to
      # work/ afterwards to avoid colliding. Uses a work-account PAT for
      # private-repo commit counts; that PAT cannot push here, so AUTO_PUSH
      # must stay off.
      - name: Generate work cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.WORK_GITHUB_TOKEN }}
        with:
          USERNAME: johnrusselangulo-cp
          UTC_OFFSET: 8
          THEME: github_dark
          BRANCH_NAME: main
          AUTO_PUSH: false

      # Move the work cards to work/ and restore the personal cards the work
      # step wiped, so both sets survive with identical colors.
      - name: Separate work cards and restore personal
        run: |
          set -eu
          rm -rf profile-summary-card-output/work
          mv profile-summary-card-output/github_dark profile-summary-card-output/work
          cp -r "$RUNNER_TEMP/personal-cards" profile-summary-card-output/github_dark
          # Both invocations write a theme-preview README at the output root and
          # the second overwrites the first, so it always described the work
          # account. It is unused - drop it instead of committing wrong content.
          rm -f profile-summary-card-output/README.md

      # Refuse to commit a half result. Without this, one silently empty
      # generation would commit a wipe of the other account's cards.
      - name: Verify both card sets exist
        run: |
          set -eu
          for dir in profile-summary-card-output/github_dark profile-summary-card-output/work; do
            count=$(find "$dir" -name '*.svg' -type f | wc -l)
            echo "$dir: $count svg"
            [ "$count" -gt 0 ] || { echo "::error::$dir contains no SVGs."; exit 1; }
          done

      # Single push with the workflow token, which owns this repo.
      - name: Commit and push cards
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so the removed output README is staged as a deletion too.
          git add -A profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No card changes."
          else
            git commit -m "chore: update profile summary cards"
            git push
          fi
