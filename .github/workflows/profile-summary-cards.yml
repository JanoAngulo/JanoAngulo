name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Personal account -> profile-summary-card-output/github_dark/
      # AUTO_PUSH off: we do one commit/push at the end so the PATs are
      # only used to read the GitHub API, never to push.
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: JanoAngulo
          UTC_OFFSET: 8
          THEME: github_dark
          BRANCH_NAME: main
          AUTO_PUSH: false

      # The action wipes ALL of profile-summary-card-output/ on each run,
      # not just its own theme. Stash the personal cards before the work
      # step deletes them, then restore afterwards.
      - name: Stash personal cards
        run: |
          rm -rf "$RUNNER_TEMP/personal-cards"
          cp -r profile-summary-card-output/github_dark "$RUNNER_TEMP/personal-cards"

      # Work account -> profile-summary-card-output/onedark/
      # Uses a work-account PAT for private-repo commit counts. That PAT
      # cannot push to this repo, so AUTO_PUSH must stay off here.
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.WORK_GITHUB_TOKEN }}
        with:
          USERNAME: johnrusselangulo-cp
          UTC_OFFSET: 8
          THEME: onedark
          BRANCH_NAME: main
          AUTO_PUSH: false

      # Restore the personal cards the work step wiped.
      - name: Restore personal cards
        run: cp -r "$RUNNER_TEMP/personal-cards" profile-summary-card-output/github_dark

      # Single push with the workflow token, which owns this repo.
      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No card changes."
          else
            git commit -m "chore: update profile summary cards"
            git push
          fi
