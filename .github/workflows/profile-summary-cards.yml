name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Personal account -> profile-summary-card-output/github_dark/
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: JanoAngulo
          UTC_OFFSET: 8
          THEME: github_dark
          BRANCH_NAME: main

      # Work account -> profile-summary-card-output/github_dark_dimmed/
      # Separate theme = separate output folder, so it never overwrites
      # the personal cards above. Uses a work-account PAT for private repos.
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.WORK_GITHUB_TOKEN }}
        with:
          USERNAME: johnrusselangulo-cp
          UTC_OFFSET: 8
          THEME: github_dark_dimmed
          BRANCH_NAME: main
